<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>House Social Interior</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #1a1a1a; touch-action: none; }
    #c { display: block; width: 100%; height: 100%; }
    #hud {
      position: absolute; left: 8px; bottom: 8px; color: #eee; font: 12px/1.4 sans-serif;
      background: rgba(0,0,0,0.45); padding: 6px 10px; border-radius: 8px; pointer-events: none;
      max-width: 70%;
    }
    #err {
      position: absolute; inset: 0; display: none; align-items: center; justify-content: center;
      background: #222; color: #f88; font: 14px sans-serif; padding: 24px; text-align: center;
    }
  </style>
</head>
<body>
  <canvas id="c"></canvas>
  <div id="hud">در حال بارگذاری…</div>
  <div id="err"></div>
  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.170.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.170.0/examples/jsm/"
    }
  }
  </script>
  <script type="module" src="engine.js"></script>
</body>
</html>
